<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Asset Evaluation Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen relative overflow-x-hidden text-slate-100">
    
    <!-- Ambient Parallax Background -->
    <div id="ambient-bg" class="fixed inset-0 z-0 pointer-events-none transition-transform duration-300 ease-out">
        <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] rounded-full bg-indigo-900/20 blur-[150px]"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] rounded-full bg-emerald-900/10 blur-[150px]"></div>
    </div>

    <!-- Error Banner -->
    <div id="error-banner" class="hidden bg-red-900/90 backdrop-blur border-b border-red-500 text-red-100 p-4 w-full fixed top-0 z-50 transition-opacity duration-300">
        <div class="flex justify-between items-center max-w-7xl mx-auto">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-3 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="error-text" class="font-medium text-sm"></span>
            </div>
            <button id="close-error" class="text-red-300 hover:text-white transition-colors">✕</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 relative z-10">
        
        <!-- Header -->
        <header class="mb-12 text-center lg:text-left animate-entry">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 tracking-tight pb-2">
                Strategic Intelligence Matrix
            </h1>
            <p class="mt-3 text-slate-400 max-w-3xl text-lg font-light leading-relaxed">
                Quantitative risk evaluation, market beta analysis, and plain-English strategic asset allocation.
            </p>
        </header>

        <!-- Input Section -->
        <section class="glass-input-container rounded-2xl p-6 mb-10 animate-entry delay-100 relative z-20">
            <form id="evaluation-form" class="flex flex-col md:flex-row gap-6 items-end">
                <div class="w-full md:w-2/5">
                    <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">Equity Ticker</label>
                    <input type="text" id="stock_ticker" required placeholder="AAPL" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg py-3 px-4 text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-cyan-500 transition-all shadow-inner">
                </div>
                <div class="w-full md:w-2/5">
                    <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">Mutual Fund Query</label>
                    <input type="text" id="mutual_fund_query" required placeholder="HDFC Mid-Cap" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg py-3 px-4 text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-magenta-500 transition-all shadow-inner">
                </div>
                <div class="w-full md:w-1/5">
                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-semibold py-3 px-4 rounded-lg uppercase tracking-wider text-sm btn-premium">
                        Execute
                    </button>
                </div>
            </form>
        </section>

        <!-- Dynamic Results Wrapper -->
        <div id="results-wrapper" class="relative min-h-[600px] w-full">
            <!-- Skeletons go here -->
            <div id="skeleton-container" class="absolute inset-0 w-full hidden opacity-0 transition-opacity duration-500 z-10"></div>
            <!-- Real Data goes here -->
            <div id="data-container" class="absolute inset-0 w-full hidden opacity-0 transition-opacity duration-500 z-20"></div>
        </div>

    </div>
    
    <script src="app.js"></script>
</body>
</html>
